[sdl]
usescancodes     = auto
output           = opengl
windowresolution = 1280x960
windowposition   = ,

[render]
aspect = true

[dosbox]
memsize = 8

[cpu]
cputype = 486
core    = normal
fpu     = true
cycles  = fixed 23880

[dos]
keyboardlayout = uk

[autoexec]
mount c c:\
mount d c:\dev\DOS\dos-stuff
set WATCOM=C:\WATCOM
set PATH=C:\WATCOM\binw;C:\DOS\TC\BIN;%PATH%
set INCLUDE=C:\WATCOM\H
d:
